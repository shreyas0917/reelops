# Terraform via GitHub OIDC (no stored AWS keys).
#   pull_request -> plan (reelops-gha-plan), posted as a PR comment
#   push to main -> plan-main (saved plan + summary) -> deploy in the protected
#                   "production" environment (reelops-gha-deploy): push missing
#                   images, then apply exactly the reviewed plan.
# Terraform stays the single source of truth: CI never changes services with
# the AWS CLI, which would drift from state and be undone by the next apply.
name: Terraform

on:
  pull_request:
    branches: [main]
    paths: &tf_paths
      - terraform/**
      - app/**
      - frontend/**
      - worker/**
      - scripts/image_tags.sh
      - scripts/push_images.sh
      - .github/workflows/terraform.yml
  push:
    branches: [main]
    paths: *tf_paths
  workflow_dispatch:

permissions: {}

# PR plans replace each other; main runs queue and are never cancelled
# mid-apply.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('terraform-pr-{0}', github.event.number) || 'terraform-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ap-south-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # Owner-controlled settings: CI must never fall back to defaults (a default
  # enable_compute=true would resume a paused stack). This repo is public and
  # GitHub prints job-level env in every step header, so anything identifying
  # (IPs, email, role ARNs with the account ID) must be a SECRET: only secrets
  # are masked from the first log line. ENABLE_COMPUTE reveals nothing.
  TF_VAR_enable_compute: ${{ vars.ENABLE_COMPUTE }}
  TF_VAR_allowed_cidrs: ${{ secrets.ALLOWED_CIDRS }}
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

jobs:
  plan:
    name: plan
    # Dependabot and fork PRs get no Actions secrets (so no plan role ARN), and
    # their code is untrusted until reviewed: they get no AWS access. CI checks
    # still gate them, and plan-main plans again before the deploy approval.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC token for reelops-gha-plan
      pull-requests: write # plan comment
    defaults:
      run:
        working-directory: terraform/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # image_tags.sh needs full history
          persist-credentials: false
      - &mask_owner
        name: mask allowlisted IPs
        # GitHub masks a secret only as a whole string; Terraform prints each
        # IP on its own (security-group rules), so mask them one by one before
        # anything else runs. Values come from the env, never the script text.
        run: python3 -c 'import json,os; [print("::add-mask::" + c.split("/")[0]) for c in json.loads(os.environ.get("TF_VAR_allowed_cidrs") or "[]")]'
      - &check_settings
        name: check owner settings
        run: |
          missing=()
          [ -n "$TF_VAR_enable_compute" ] || missing+=("variable ENABLE_COMPUTE")
          [ -n "$TF_VAR_allowed_cidrs" ] || missing+=("secret ALLOWED_CIDRS")
          [ -n "$TF_VAR_alert_email" ] || missing+=("secret ALERT_EMAIL")
          if [ ${#missing[@]} -gt 0 ]; then echo "::error::Not set: ${missing[*]}"; exit 1; fi
          case "$TF_VAR_enable_compute" in true | false) ;; *) echo "::error::ENABLE_COMPUTE must be true or false"; exit 1 ;; esac
      - &image_tags
        name: image tags
        id: tags
        working-directory: .
        run: scripts/image_tags.sh | tee -a "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-plan-${{ github.run_id }}
          mask-aws-account-id: true
          aws-region: ap-south-1
      - &mask_account
        name: mask account ID, locate state bucket
        run: |
          # Already masked via the role ARN secret and mask-aws-account-id;
          # masked again here because later output (ARNs, ECR URLs) contains it.
          ACCT=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::$ACCT"
          { echo "ACCT=$ACCT"; echo "TF_STATE_BUCKET=reelops-tfstate-$ACCT"; } >> "$GITHUB_ENV"
      - &setup_terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - &init
        name: terraform init
        run: terraform init -backend-config="bucket=$TF_STATE_BUCKET"
      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -lock-timeout=5m -no-color -detailed-exitcode \
            -var "api_image_tag=${{ steps.tags.outputs.api }}" \
            -var "worker_image_tag=${{ steps.tags.outputs.worker }}" > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          [ "$code" -ne 1 ] # 0 = no changes, 2 = changes, 1 = error
      - name: post plan comment
        if: always() && steps.plan.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          API_TAG: ${{ steps.tags.outputs.api }}
          WORKER_TAG: ${{ steps.tags.outputs.worker }}
        run: |
          marker="<!-- reelops-terraform-plan -->"
          {
            echo "$marker"
            echo "### Terraform plan for \`${GITHUB_SHA:0:7}\` (${{ steps.plan.outcome }})"
            echo "Image tags: api \`$API_TAG\`, worker \`$WORKER_TAG\`, enable_compute \`$TF_VAR_enable_compute\`"
            echo
            echo "**$(grep -E '^(Plan:|No changes|Error:)' plan.txt | head -1)**"
            echo
            # shellcheck disable=SC2016 # literal Markdown backticks, not command substitution
            grep -E '^  # [^(].* (will|must) be ' plan.txt | sed -E 's/^  # ([^ ]+) (.*)/- `\1` \2/' || true
            echo
            echo "<details><summary>Full plan</summary>"
            echo
            echo '```'
            head -c 60000 plan.txt
            echo '```'
            echo "</details>"
          } | ../../scripts/redact.py > comment.md
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@comment.md >/dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          fi

  plan-main:
    name: plan-main
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC token for reelops-gha-plan (refs/heads/main)
    defaults:
      run:
        working-directory: terraform/main
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - *mask_owner
      - *check_settings
      - *image_tags
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-plan-main-${{ github.run_id }}
          mask-aws-account-id: true
          aws-region: ap-south-1
      - *mask_account
      - *setup_terraform
      - *init
      - name: terraform plan (saved)
        id: plan
        run: |
          set +e
          terraform plan -lock-timeout=5m -no-color -detailed-exitcode -out=tfplan \
            -var "api_image_tag=${{ steps.tags.outputs.api }}" \
            -var "worker_image_tag=${{ steps.tags.outputs.worker }}" > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          [ "$code" -ne 1 ]
          echo "changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: plan summary (review this before approving the deploy)
        run: |
          {
            echo "### Terraform plan for \`${GITHUB_SHA:0:7}\`"
            echo "**$(grep -E '^(Plan:|No changes)' plan.txt | head -1)**"
            echo
            # shellcheck disable=SC2016 # literal Markdown backticks, not command substitution
            grep -E '^  # [^(].* (will|must) be ' plan.txt | sed -E 's/^  # ([^ ]+) (.*)/- `\1` \2/' || true
            echo
            echo '<details><summary>Full plan</summary>'
            echo
            echo '```'
            cat plan.txt
            echo '```'
            echo '</details>'
          } | ../../scripts/redact.py >> "$GITHUB_STEP_SUMMARY"
      # The saved plan holds values like the alert email: keep it briefly.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.changes == 'true'
        with:
          name: tfplan-${{ github.sha }}
          path: terraform/main/tfplan
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: deploy
    needs: plan-main
    if: needs.plan-main.outputs.changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Required reviewer: the approval happens here, after plan-main's summary.
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC token for reelops-gha-deploy (environment:production)
    defaults:
      run:
        working-directory: terraform/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - *mask_owner
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-deploy-${{ github.run_id }}
          mask-aws-account-id: true
          aws-region: ap-south-1
      - *mask_account
      - *setup_terraform
      - *init
      # Same script as locally: builds and pushes only tags missing from ECR.
      - name: push missing images
        working-directory: .
        run: scripts/push_images.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-${{ github.sha }}
          path: terraform/main
      # Applies exactly the reviewed plan; fails if state changed since.
      - name: terraform apply
        run: terraform apply -lock-timeout=5m -no-color tfplan
      - name: summary
        run: |
          {
            echo "### Deployed \`${GITHUB_SHA:0:7}\`"
            echo "API: $(terraform output -raw api_url 2>/dev/null || echo 'paused (enable_compute=false)')"
            echo
            echo '```'
            ../../scripts/image_tags.sh
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
