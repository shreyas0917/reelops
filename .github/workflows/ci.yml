# CI: lint, tests and image checks on every pull request and push to main.
# Third-party actions are pinned to full commit SHAs (version in the comment);
# tools run as pinned container images, the same way as on the dev box.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a PR replaces its old run; main runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HADOLINT_IMAGE: hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d # v2.15.1
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
  TRIVY_IMAGE: aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa # 0.75.0

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: ruff
        run: |
          pip install ruff==0.17.0
          ruff check --output-format github app worker
      - name: hadolint
        run: |
          for f in worker/Dockerfile app/Dockerfile; do
            echo "::group::$f"
            docker run --rm -i -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml:ro" "$HADOLINT_IMAGE" hadolint - < "$f"
            echo "::endgroup::"
          done
      # Only paths that go into an image may change its tag (and so trigger a
      # rebuild and a deploy). Builds its own repo, so a shallow checkout is fine.
      - name: image tag rules
        run: scripts/test_image_tags.sh

  terraform:
    name: terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0 # same version that writes the state
          terraform_wrapper: false
      - run: terraform fmt -check -recursive terraform
      - name: validate (no backend, no AWS credentials)
        run: |
          for dir in terraform/bootstrap terraform/main; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history: a deleted secret is still leaked
          persist-credentials: false
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" git --redact --no-banner -v /repo

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1" # same as the Docker build stage
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Build the test target and run the tests, then build the production image
  # (reusing the same layers) and fail on CRITICAL vulnerabilities.
  api:
    name: api
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/Dockerfile
          target: test
          tags: reelops-api:test
          load: true
          provenance: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: tests (no network)
        run: docker run --rm --network none reelops-api:test
      - name: build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/Dockerfile
          tags: reelops-api:ci
          load: true
          provenance: false
          cache-from: type=gha,scope=api
      - name: trivy (fail on CRITICAL)
        run: |
          docker save reelops-api:ci -o "$RUNNER_TEMP/image.tar"
          docker run --rm -v "$RUNNER_TEMP:/scan" -v "$PWD/.trivyignore.yaml:/scan/.trivyignore.yaml:ro" "$TRIVY_IMAGE" \
            image --input /scan/image.tar --severity CRITICAL --ignorefile /scan/.trivyignore.yaml --exit-code 1

  worker:
    name: worker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: worker
          target: test
          tags: reelops-worker:test
          load: true
          provenance: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
      - name: tests (no network)
        run: docker run --rm --network none reelops-worker:test
      - name: build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: worker
          tags: reelops-worker:ci
          load: true
          provenance: false
          cache-from: type=gha,scope=worker
      - name: trivy (fail on CRITICAL)
        run: |
          docker save reelops-worker:ci -o "$RUNNER_TEMP/image.tar"
          docker run --rm -v "$RUNNER_TEMP:/scan" -v "$PWD/.trivyignore.yaml:/scan/.trivyignore.yaml:ro" "$TRIVY_IMAGE" \
            image --input /scan/image.tar --severity CRITICAL --ignorefile /scan/.trivyignore.yaml --exit-code 1
